name: 🐞 Bug report
description: Something does not work as expected.
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. **Security issues do not belong here** — see SECURITY.md.
        Never paste passwords, tokens, `.env` contents or real customer data.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click on …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Pre-production / staging
        - Local development
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version, commit or URL
      placeholder: e.g. v1.4.2, a2de2c1, https://…
  - type: textarea
    id: context
    attributes:
      label: Device, browser, logs or screenshots
      description: OS, browser or app version, relevant logs (redacted) and screenshots.
